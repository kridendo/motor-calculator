<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Розрахунок норії</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #fff;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

label {
  display: flex;
  justify-content: space-between;
}

input {
  width: 100px;
}

button {
  margin-top: 15px;
  background: #0d6efd;
  color: #fff;
  padding: 12px 25px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.result p {
  margin: 6px 0;
}
</style>
</head>

<body>

<div class="container">
<h1>Розрахунок норії</h1>

<div class="card">
<h2>Вхідні дані</h2>

<div class="row">
<label>B, мм <input id="B" value="300"></label>
<label>ρ, т/м³ <input id="rho" value="0.7"></label>
<label>H, м <input id="H" value="30"></label>
<label>Q, т/год <input id="Q" value="100"></label>
<label>Крок ковшів t, мм <input id="t" value="200"></label>
<label>Швидкість v, м/с <input id="v" value="2.5"></label>
<label>D барабана, м <input id="D" value="0.65"></label>
<label>Обʼєм ковша V, л <input id="V" value="3.2"></label>
</div>

<button onclick="calc()">Розрахувати</button>
</div>

<div class="card result" id="out">
<p>Очікую розрахунок…</p>
</div>

</div>

<script>
function calc() {

  // ===== ВХІД =====
  const rho = +document.getElementById("rho").value;      // т/м3
  const H   = +document.getElementById("H").value;        // м
  const V   = +document.getElementById("V").value / 1000; // м3
  const t   = +document.getElementById("t").value / 1000; // м
  const v   = +document.getElementById("v").value;        // м/с
  const D6  = +document.getElementById("D").value;        // м

  const g = 9.81;

  // ===== ПРОДУКТИВНІСТЬ (Mathcad) =====
  const Qfact = (V * rho / t) * v;     // т/с
  const Q_tph = Qfact * 3600;          // т/год (для виводу)

  // ===== ОБЕРТИ =====
  const n6 = v / (Math.PI * D6) * 60;  // об/хв

  // ===== ПОГОННІ НАВАНТАЖЕННЯ =====
  const q = Qfact / v * 1000;          // кг/м (як у Mathcad)

  const mBucket = 1;                   // кг (з Mathcad)
  const qBucket = mBucket / t;         // кг/м

  const qx = q + qBucket;

  // ===== ОПОРИ =====
  const Wrab = (q + qx) * H;            // кг
  const W0 = Wrab;                      // кг

  // ===== МОМЕНТ =====
  const M = (D6 / 2) * W0 * g;          // Н·м

  // ===== ПОТУЖНІСТЬ =====
  const eta = 0.94;
  const kzap = 1.05;

  const N = kzap * W0 * g * v / (1000 * eta); // кВт

  // ===== ВИВІД =====
  document.getElementById("out").innerHTML = `
    <h2>Результати</h2>
    <p>Qфакт = <b>${Q_tph.toFixed(1)} т/год</b></p>
    <p>n барабана = <b>${n6.toFixed(2)} об/хв</b></p>
    <p>q = <b>${q.toFixed(2)} кг/м</b></p>
    <p>W₀ = <b>${W0.toFixed(1)} кг</b></p>
    <p>M = <b>${M.toFixed(0)} Н·м</b></p>
    <p>N = <b>${N.toFixed(2)} кВт</b></p>
  `;
}
</script>

</body>
</html>
