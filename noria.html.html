<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Розрахунок норії</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #fff;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

label {
  display: flex;
  justify-content: space-between;
}

input {
  width: 100px;
}

button {
  margin-top: 15px;
  background: #0d6efd;
  color: #fff;
  padding: 12px 25px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.result p {
  margin: 6px 0;
}
</style>
</head>

<body>

<div class="container">
<h1>Розрахунок норії</h1>

<div class="card">
<h2>Вхідні дані</h2>

<div class="row">
<label>B, мм <input id="B" value="300"></label>
<label>ρ, т/м³ <input id="rho" value="0.7"></label>
<label>H, м <input id="H" value="30"></label>
<label>Q, т/год <input id="Q" value="100"></label>
<label>Крок ковшів t, мм <input id="t" value="200"></label>
<label>Швидкість v, м/с <input id="v" value="2.5"></label>
<label>D барабана, м <input id="D" value="0.65"></label>
<label>Обʼєм ковша V, л <input id="V" value="3.2"></label>
</div>

<button onclick="calc()">Розрахувати</button>
</div>

<div class="card result" id="out">
<p>Очікую розрахунок…</p>
</div>

</div>

<script>
function calc() {

  const rho = +document.getElementById("rho").value;
  const H   = +document.getElementById("H").value;
  const Q   = +document.getElementById("Q").value;
  const t   = +document.getElementById("t").value / 1000;
  const v   = +document.getElementById("v").value;
  const D   = +document.getElementById("D").value;
  const V   = +document.getElementById("V").value / 1000;

  const g = 9.81;

  // ===== Mathcad =====
  const Qfact = V * rho / t * v * 3600;
  const n6 = v / (Math.PI * D) * 60;

  const q = Qfact / v;         // кг/м
  const qk = 1 / t;            // кг/м
  const qx = q + qk;

  const Wrab = (q + qx) * H;
  const W0 = Wrab;

  const M = D / 2 * W0 * g;

  const eta = 0.94;
  const kzap = 1.05;

  const N = kzap * W0 * g * v / (1000 * eta);

  document.getElementById("out").innerHTML = `
  <h2>Результати</h2>
  <p>Фактична продуктивність Qфакт = <b>${Qfact.toFixed(1)} т/год</b></p>
  <p>Оберти барабана n = <b>${n6.toFixed(1)} об/хв</b></p>
  <p>Погонне навантаження q = <b>${q.toFixed(1)} кг/м</b></p>
  <p>Момент на барабані M = <b>${M.toFixed(0)} Н·м</b></p>
  <p>Потужність двигуна N = <b>${N.toFixed(2)} кВт</b></p>
  `;
}
</script>

</body>
</html>
