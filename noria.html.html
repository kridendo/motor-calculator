<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Розрахунок норії</title>
<style>
body { font-family: Arial; max-width: 900px; margin: auto; }
input { width: 120px; }
.result { background: #f4f4f4; padding: 10px; margin-top: 15px; }
</style>
</head>
<body>

<h1>Розрахунок норії</h1>

<h3>Вхідні дані</h3>
<label>B (мм): <input id="B" value="300"></label><br>
<label>ρ (т/м³): <input id="rho" value="0.7"></label><br>
<label>H (м): <input id="H" value="30"></label><br>
<label>V ковша (л): <input id="V" value="3.2"></label><br>
<label>Крок t (мм): <input id="t" value="200"></label><br>
<label>v (м/с): <input id="v" value="2.5"></label><br>
<label>D барабана (м): <input id="D" value="0.65"></label><br>

<button onclick="calc()">Розрахувати</button>

<div class="result" id="out"></div>

<script>
function calc() {
  let rho = +rho.value;
  let V = +V.value / 1000;
  let t = +t.value / 1000;
  let v = +v.value;
  let D = +D.value;

  let Qf = V * rho / t * v * 3600;
  let n = v / (Math.PI * D) * 60;
  let r = D / 2;
  let m = 1.4;
  let Fw = m * v * v / r;

  out.innerHTML = `
  <b>Результати:</b><br>
  Фактична продуктивність: ${Qf.toFixed(2)} т/год<br>
  Оберти барабана: ${n.toFixed(2)} об/хв<br>
  Радіус барабана: ${r.toFixed(3)} м<br>
  Відцентрова сила: ${Fw.toFixed(2)} Н
  `;
}
</script>

</body>
</html>
